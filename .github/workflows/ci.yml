name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest moved to 26.04, which has no setup-python build of
    # 3.8/3.9 - those matrix rows die before a test runs.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml, so it is the
        # version that matters most: the claim is that this works
        # there, so that is where the matrix starts.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest test_tiny_retry.py -v
